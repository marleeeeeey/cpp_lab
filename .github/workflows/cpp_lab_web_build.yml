name: Build "GameEngine" target and ZIP it for GitHub Pages
on:
  workflow_call:

jobs:

  emscripten:

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: marleeeeeey/cpp_lab
          # The argument "path" is required because it will be checked out from another repo.
          # Relative paths "cpp_lab/build", "cpp_lab" use in other steps (see below).
          path: cpp_lab
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Build host flatc (matches FlatBuffers headers version)
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential
          git clone --depth 1 --branch v25.12.19 https://github.com/google/flatbuffers.git flatbuffers_host
          cmake -S flatbuffers_host -B flatbuffers_host/build -G Ninja \
            -DFLATBUFFERS_BUILD_TESTS=OFF \
            -DFLATBUFFERS_BUILD_FLATC=ON
          cmake --build flatbuffers_host/build --target flatc
          echo "FLATC_HOST_EXECUTABLE=$PWD/flatbuffers_host/build/flatc" >> $GITHUB_ENV

      - name: Get CMake and ninja
        uses: lukka/get-cmake@9e07ecdcee1b12e5037e42f410b67f03e2f626e1 # v4.2.1

      - name: Run CMake
        run: |
          cmake -S cpp_lab -B cpp_lab/build \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -GNinja \
            -D3RD_PARTY_BUILD_EXAMPLES=OFF \
            -DFLATC_HOST_EXECUTABLE="${{ env.FLATC_HOST_EXECUTABLE }}"

      - name: Build GameEngine and Archive Artifacts
        run: cmake --build cpp_lab/build --target GameEngine
        # Log:
        # [241/241] Linking CXX executable GameEngine/GameEngine.html
        # Creating /home/runner/work/marleeeeeey.github.io/marleeeeeey.github.io/cpp_lab/build/GameEngine/GameEngine_itch_web.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: cpp_lab_web_build_artifact
          path: ./cpp_lab/build/GameEngine/GameEngine_itch_web.zip
        # Result:
        # cpp_lab_web_build_artifact.zip (invisible from the user point of view)
        #   GameEngine_itch_web.zip
        #     GameEngine.data
        #     GameEngine.js
        #     GameEngine.wasm
        #     index.html
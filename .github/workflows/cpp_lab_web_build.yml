name: Build GameEngine target for GitHub Pages publication
on:
  workflow_call:

jobs:

  emscripten:

    runs-on: ubuntu-latest

    steps:

      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: marleeeeeey/cpp_lab
          path: cpp_lab
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Get CMake and ninja
        uses: lukka/get-cmake@9e07ecdcee1b12e5037e42f410b67f03e2f626e1 # v4.2.1

      - name: Run CMake
        run: |
          cmake -S cpp_lab -B cpp_lab/build \
            -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake \
            -GNinja \
            -D3RD_PARTY_BUILD_EXAMPLES=OFF

      - name: Build GameEngine and Archive Artifacts
        run: cmake --build cpp_lab/build --target GameEngine

      - name: Upload web build artifact for outer workflow
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: cpp_lab_web_build_artifact
          path: ./cpp_lab/build/GameEngine/GameEngine_itch_web.zip
            # GameEngine.data
            # GameEngine.js
            # GameEngine.wasm
          # index.html